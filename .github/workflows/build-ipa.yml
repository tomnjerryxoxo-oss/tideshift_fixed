name: Build iOS Ipa

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Ipa
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get

      # Prepare config & CocoaPods
      - run: flutter build ios --config-only --no-codesign

      # Build Xcode Project dengan opsi bypass signing & lokasi output yang presisi
      - name: Build Xcode Project
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_BUILD_SETTINGS=NO \
            ONLY_ACTIVE_ARCH=NO

      # Cari Runner.app secara dinamis lalu kemas jadi IPA
      - name: Create IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build_output -name "Runner.app" -type d | head -n 1)
          echo "Found Runner.app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -qq -r -9 FlutterIpaExport.ipa Payload

      # Upload ke GitHub Release
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: FlutterIpaExport.ipa
          tag: v1.0
          overwrite: true
          body: "Build iOS IPA Unsigned"
