name: Build iOS Ipa

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Ipa
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get

      # Prepare iOS & CocoaPods tanpa trigger build penuh
      - run: flutter build ios --config-only --no-codesign

      # Panggil xcodebuild langsung buat bypass penanganan signing dari Flutter CLI
      - name: Build Xcode Project
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_BUILD_SETTINGS=NO \
            ONLY_ACTIVE_ARCH=NO \
            derivedDataPath build

      # Buat folder Payload dan zip jadi IPA
      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -qq -r -9 FlutterIpaExport.ipa Payload

      # Upload ke GitHub Release (sama kayak script artikel)
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: FlutterIpaExport.ipa
          tag: v1.0
          overwrite: true
          body: "Build iOS IPA Unsigned"
