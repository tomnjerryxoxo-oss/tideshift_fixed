name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # Install CocoaPods dependencies untuk iOS
      - name: Install Pods
        run: |
          cd ios
          pod install

      # Build Xcode project langsung dengan mematikan keharusan Code Signing
      - name: Build Runner via xcodebuild
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_BUILD_SETTINGS=NO \
            ONLY_ACTIVE_ARCH=NO

      # Packaging hasil build menjadi file IPA
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/ || cp -r ios/build/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: app.ipa
